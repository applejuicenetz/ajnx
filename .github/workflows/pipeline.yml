name: pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Install dependencies
        run: |
          go install github.com/a-h/templ/cmd/templ@latest
          templ generate
          go mod tidy

      - name: Build Gateway
        run: go build -v ./cmd/gateway

      - name: Build UI
        run: go build -v ./cmd/ui
